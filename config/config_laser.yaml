# =============================================================================
# TTC450 - modo LASER (módulo 1.5 W / 20 W na porta TTL)
# Placa: MKS DLC32 V2.1 (ESP32, 8 MB flash)
# Base: config pública do diode-laser-wiki (02/02/2024), revisada e validada
#       contra o FluidNC v4.1.1.
#
# Para voltar ao modo CNC:
#   $Config/Filename=config_cnc.yaml
#   $Bye
#
# O laser usa a porta TTL de 3 pinos (S = 0-5 V PWM, V = 12/24 V, G = GND).
# Não conecte o módulo laser na porta CNC de 2 pinos.
# =============================================================================

board: MKS DLC32 2.1
name: TTC450 Laser
meta: TTC450 / MKS DLC32 V2.1 - config laser

arc_tolerance_mm: 0.002
junction_deviation_mm: 0.01
verbose_errors: false
report_inches: false

stepping:
  engine: I2S_STATIC
  idle_ms: 255
  pulse_us: 6
  dir_delay_us: 10
  disable_delay_us: 0

axes:
  shared_stepper_disable_pin: I2SO.0

  x:
    steps_per_mm: 800.000
    max_rate_mm_per_min: 800.000
    acceleration_mm_per_sec2: 400.000
    max_travel_mm: 460.000
    soft_limits: false
    homing:
      cycle: 2
      allow_single_axis: true
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 75.000
      seek_mm_per_min: 600.000
      settle_ms: 500
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      limit_neg_pin: gpio.36:low
      hard_limits: true
      pulloff_mm: 1.000
      standard_stepper:
        step_pin: I2SO.1
        direction_pin: I2SO.2:low

  y:
    steps_per_mm: 800.000
    max_rate_mm_per_min: 800.000
    acceleration_mm_per_sec2: 400.000
    max_travel_mm: 460.000
    soft_limits: false
    homing:
      cycle: 2
      allow_single_axis: true
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 75.000
      seek_mm_per_min: 600.000
      settle_ms: 500
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      limit_neg_pin: gpio.35:low
      hard_limits: true
      pulloff_mm: 1.000
      standard_stepper:
        step_pin: I2SO.5
        direction_pin: I2SO.6:low

  z:
    steps_per_mm: 800.000
    max_rate_mm_per_min: 800.000
    acceleration_mm_per_sec2: 400.000
    max_travel_mm: 80.000
    soft_limits: false
    homing:
      cycle: 1
      allow_single_axis: true
      positive_direction: true
      mpos_mm: 0.000
      feed_mm_per_min: 75.000
      seek_mm_per_min: 400.000
      settle_ms: 500
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      limit_pos_pin: gpio.34:low
      hard_limits: true
      pulloff_mm: 1.000
      standard_stepper:
        step_pin: I2SO.3
        direction_pin: I2SO.4:low

i2so:
  bck_pin: gpio.16
  data_pin: gpio.21
  ws_pin: gpio.17

spi:
  miso_pin: gpio.12
  mosi_pin: gpio.13
  sck_pin: gpio.14

sdcard:
  card_detect_pin: NO_PIN
  cs_pin: gpio.15

probe:
  pin: gpio.22:low
  check_mode_start: true

start:
  must_home: false

coolant:
  flood_pin: NO_PIN
  mist_pin: NO_PIN
  delay_ms: 0

# Laser na porta TTL de 3 pinos (0-5 V).
# S0-S1000 é o padrão do LightBurn/LaserGRBL para laser.
Laser:
  pwm_hz: 1500
  output_pin: gpio.32
  enable_pin: NO_PIN
  disable_with_s0: false
  s0_with_disable: true
  tool_num: 100
  speed_map: 0=0.000% 1000=100.000%

control:
  safety_door_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN
  cycle_start_pin: NO_PIN
  macro0_pin: NO_PIN
  macro1_pin: NO_PIN
  macro2_pin: NO_PIN
  macro3_pin: NO_PIN

macros:
  startup_line0:
  startup_line1:
  macro0:
  macro1:
  macro2:
  macro3:

user_outputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  analog0_hz: 5000
  analog1_hz: 5000
  analog2_hz: 5000
  analog3_hz: 5000
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN

